name: Pull thannob brief and notify LINE

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily = 12:00 Bangkok (primary)
    - cron: '0 6 * * *'   # 06:00 UTC daily = 13:00 Bangkok (backup — GitHub's schedule trigger is best-effort and has been observed dropping/delaying runs by hours)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to notify for, YYYY-MM-DD (defaults to catching up the oldest un-notified day)'
        required: false

permissions:
  contents: write   # needed to commit the last-notified marker after a successful send

concurrency:
  group: pull-and-notify-line
  cancel-in-progress: false   # let the primary/backup pair queue instead of racing each other

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine target date
        id: date
        run: |
          set -euo pipefail
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "target=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Catch-up loop: find the oldest day after the last confirmed
          # notification whose brief is published, capped at "today"
          # (Bangkok). This is deliberately anchored to the last known-good
          # day rather than wall-clock "today" alone — a scheduled run that
          # fires hours late (crossing midnight Bangkok) must not silently
          # ask for a not-yet-published "tomorrow" and skip a real day.
          STATE_FILE=.github/state/last-notified.txt
          if [ -f "$STATE_FILE" ]; then
            LAST=$(cat "$STATE_FILE")
          else
            LAST=$(TZ=Asia/Bangkok date -d yesterday +%F)
          fi
          TODAY=$(TZ=Asia/Bangkok date +%F)
          CANDIDATE=$(TZ=Asia/Bangkok date -d "$LAST + 1 day" +%F)

          TARGET=""
          while [[ "$CANDIDATE" < "$TODAY" || "$CANDIDATE" == "$TODAY" ]]; do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://raw.githubusercontent.com/thannob/dailyainews/main/articles/${CANDIDATE}-brief.md")
            if [ "$STATUS" == "200" ]; then
              TARGET="$CANDIDATE"
              break
            fi
            CANDIDATE=$(TZ=Asia/Bangkok date -d "$CANDIDATE + 1 day" +%F)
          done

          if [ -z "$TARGET" ]; then
            echo "No un-notified brief published yet (checked $LAST+1 through $TODAY)."
            exit 0
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Fetch brief from thannob/dailyainews
        if: steps.date.outputs.target != ''
        env:
          TARGET: ${{ steps.date.outputs.target }}
        run: |
          URL="https://raw.githubusercontent.com/thannob/dailyainews/main/articles/${TARGET}-brief.md"
          echo "Fetching $URL"
          HTTP_STATUS=$(curl -sS -o brief.md -w '%{http_code}' "$URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::Brief for $TARGET disappeared between check and fetch (status=$HTTP_STATUS)."
            echo "FOUND=0" >> "$GITHUB_ENV"
          else
            echo "FOUND=1" >> "$GITHUB_ENV"
          fi

      - name: Dispatch LINE notification
        if: steps.date.outputs.target != '' && env.FOUND == '1'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          TARGET: ${{ steps.date.outputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${LINE_TOKEN:-}" ] || [ -z "${LINE_TO:-}" ]; then
            echo "::warning::LINE secrets not set — skipping."
            exit 0
          fi
          PERMALINK="https://github.com/thannob/dailyainews/blob/main/articles/${TARGET}-brief.md"
          MESSAGE=$(python3 .github/scripts/build_line_message.py brief.md "$PERMALINK")
          PAYLOAD=$(jq -n --arg to "$LINE_TO" --arg text "$MESSAGE" \
            '{to:$to, messages:[{type:"text", text:$text}]}')
          HTTP_STATUS=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${LINE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "LINE API status: $HTTP_STATUS"; cat /tmp/resp.txt
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::LINE push failed"; exit 1
          fi
          echo "✅ LINE notification delivered."

      - name: Record notified date
        if: steps.date.outputs.target != '' && env.FOUND == '1'
        env:
          TARGET: ${{ steps.date.outputs.target }}
        run: |
          set -euo pipefail
          mkdir -p .github/state
          echo "$TARGET" > .github/state/last-notified.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/state/last-notified.txt
          if git diff --cached --quiet; then
            echo "State already up to date."
            exit 0
          fi
          git commit -m "chore(state): mark $TARGET as notified [skip line]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
